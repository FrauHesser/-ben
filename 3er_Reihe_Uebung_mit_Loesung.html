<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3er-Reihe – Übung mit Lösung</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center}#start,#again{font-size:clamp(24px,4vw,46px);padding:18px 36px;cursor:pointer}#exercise{display:none;align-items:baseline;justify-content:center;gap:clamp(24px,7vw,120px);white-space:nowrap}#counter{font-size:clamp(32px,5vw,75px)}#math{font-size:clamp(58px,10vw,150px)}#first{font-size:1.4em;font-weight:bold}#solution{visibility:hidden}#end{display:none;text-align:center;font-size:clamp(30px,5vw,70px)}#end button{display:block;margin:30px auto}button{background:#fff;color:#000;border:0;border-radius:12px}</style></head><body><main><button id="start">Starten</button><div id="exercise"><span id="counter"></span><span id="math"><span id="first"></span> • 3 = <span id="solution"></span></span></div><div id="end">Fertig!<button id="again">Erneut starten</button></div></main><script>const start=document.getElementById('start'),again=document.getElementById('again'),exercise=document.getElementById('exercise'),end=document.getElementById('end'),counter=document.getElementById('counter'),first=document.getElementById('first'),solution=document.getElementById('solution');let timers=[];function begin(){timers.forEach(clearTimeout);timers=[];const nums=Array.from({length:10},(_,i)=>i+1);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]];}start.style.display='none';end.style.display='none';exercise.style.display='flex';nums.forEach((n,i)=>{timers.push(setTimeout(()=>{counter.textContent=(i+1)+')';first.textContent=n;solution.textContent=n*3;solution.style.visibility='hidden'},i*7000));timers.push(setTimeout(()=>{solution.style.visibility='visible'},i*7000+5000));});timers.push(setTimeout(()=>{exercise.style.display='none';end.style.display='block'},70000));}start.onclick=begin;again.onclick=begin;</script></body></html>
