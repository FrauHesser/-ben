<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6er-Reihe – Übung mit Lösung</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center}.display{display:flex;align-items:baseline;white-space:nowrap}.num{font-size:clamp(35px,5vw,75px);margin-right:clamp(65px,12vw,210px)}.first{font-size:clamp(95px,17vw,260px);font-weight:bold}.rest{font-size:clamp(65px,10vw,155px)}.answer{font-size:clamp(75px,12vw,180px);font-weight:bold}button{background:#fff;color:#000;border:0;border-radius:12px;padding:16px 32px;font-size:25px;cursor:pointer}#intro,#done{text-align:center}#exercise,#done{display:none}p{font-size:20px;color:#bbb}</style></head><body><main><div id="intro"><button id="start">Starten</button><p>10 Aufgaben · 5 Sekunden rechnen · 2 Sekunden Lösung</p></div><div id="exercise" class="display"><span class="num" id="num"></span><span class="first" id="factor"></span><span class="rest"> • 6 = </span><span class="answer" id="answer"></span></div><div id="done"><p>Alle 10 Aufgaben geschafft!</p><button id="restart">Erneut starten</button></div></main><script>const intro=document.getElementById('intro'),exercise=document.getElementById('exercise'),done=document.getElementById('done'),num=document.getElementById('num'),factor=document.getElementById('factor'),answer=document.getElementById('answer');let timers=[];function start(){timers.forEach(clearTimeout);timers=[];let order=Array.from({length:10},(_,i)=>i+1);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}intro.style.display='none';done.style.display='none';exercise.style.display='flex';function show(i){if(i===10){exercise.style.display='none';done.style.display='block';return;}num.textContent=(i+1)+')';factor.textContent=order[i];answer.textContent='';timers.push(setTimeout(()=>{answer.textContent=order[i]*6;timers.push(setTimeout(()=>show(i+1),2000));},5000));}show(0);}document.getElementById('start').onclick=start;document.getElementById('restart').onclick=start;</script></body></html>
